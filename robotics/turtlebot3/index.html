body.bgs-nav-on .mob .row{flex-wrap:nowrap;overflow-x:auto}
@media (orientation:landscape) and (max-height:520px){.mob.cap,body.bgs-nav-on .mob.cap{left:auto;right:max(8px,env(safe-area-inset-right));width:min(46vw,440px);top:calc(var(--bg-bar,48px) + 8px);bottom:auto;max-height:calc(100svh - var(--bg-bar,48px) - 16px)}}
html[data-chieu] .mob.cap{background:#fff}html[data-chieu] .mob.cap .b{font-size:18px;color:#000}html[data-chieu] .mob.cap .t{font-size:24px}
/* thanh t\u1ED1c \u0111\u1ED9 chu\u1EA9n c\u1EE7a b\u1ED9 robotics: t\u1EA1m d\u1EEBng, 0,5\xD7 \u0111\u1EBFn 10\xD7, nh\u01B0 tr\xF2 ch\u01A1i chi\u1EBFn thu\u1EADt */
.lv-time{position:fixed;z-index:21;right:16px;top:calc(var(--bg-bar,0px) + 12px + env(safe-area-inset-top));display:none;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 10px 26px -18px rgba(16,24,40,.45),0 0 0 .5px rgba(16,24,40,.08);font:600 13px var(--bg-font,system-ui,sans-serif);color:#15171C}
body.cmp .lv-time{display:flex}
.lv-time .lb{padding:0 6px 0 10px;color:#626773;font-weight:500}
.lv-time button{height:32px;min-width:40px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:#454A55;font:inherit;font-variant-numeric:tabular-nums;cursor:pointer}
.lv-time button:hover{background:#f1f2f5}
.lv-time button.on{background:#15171C;color:#fff}
@media (pointer:coarse){.lv-time button{height:44px;min-width:44px}}
@media (max-width:520px){.lv-time .lb{display:none}.lv-time button{min-width:44px;padding:0 6px}}
/* th\u1EBB soi chi ti\u1EBFt: b\u1EA5m v\xE0o m\u1ED9t chi ti\u1EBFt trong c\u1EA3nh, camera b\xE1m theo n\xF3 */
.lv-insp{position:fixed;z-index:21;right:16px;top:calc(var(--bg-bar,0px) + 64px + env(safe-area-inset-top));width:min(340px,calc(100vw - 32px));display:none;box-sizing:border-box;padding:14px 16px 12px;border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 18px 44px -18px rgba(16,24,40,.34),0 0 0 .5px rgba(16,24,40,.08);font-family:var(--bg-font,system-ui,sans-serif);color:#15171C;max-height:calc(100svh - var(--bg-bar,0px) - 96px);overflow:auto}
.lv-insp.on{display:block}
.lv-insp .k{font:600 13px/1.3 var(--bg-font,system-ui,sans-serif);color:#5B6472;margin-right:40px}
.lv-insp .t{font:700 19px/1.25 var(--bg-font,system-ui,sans-serif);letter-spacing:-.01em;margin:3px 40px 6px 0}
.lv-insp .b{font:500 14.5px/1.55 var(--bg-font,system-ui,sans-serif);color:#454A55;margin:0 0 8px}
.lv-insp table{width:100%;border-collapse:collapse;font-size:13.5px}
.lv-insp td{padding:5px 0;border-top:1px solid rgba(16,24,40,.08);color:#454A55;vertical-align:top}
.lv-insp td+td{text-align:right;color:#15171C;font-weight:600;font-variant-numeric:tabular-nums;padding-left:12px}
.lv-insp .x{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:10px;background:none;font-size:22px;line-height:1;color:#626773;cursor:pointer}
.lv-insp .x:hover{background:#f1f2f5}
.lv-insp .act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lv-insp .act button{height:36px;padding:0 14px;border:1px solid rgba(16,24,40,.18);border-radius:999px;background:#fff;font:600 13.5px var(--bg-font,system-ui,sans-serif);color:#15171C;cursor:pointer}
.lv-insp .act button.on{background:#15171C;color:#fff;border-color:#15171C}
.lv-insp .fol{display:flex;align-items:center;gap:7px;margin-top:10px;font:500 13px var(--bg-font,system-ui,sans-serif);color:#626773}
.lv-insp .fol i{width:7px;height:7px;border-radius:50%;background:#1E2A44;animation:blink 1.4s steps(2) infinite}
.lv-insp .src{margin-top:6px;font-size:13px;line-height:1.45;color:#626773}
@media (pointer:coarse){.lv-insp .x{width:44px;height:44px}.lv-insp .act button{height:44px}}
@media (max-width:700px){.lv-insp{left:8px;right:8px;width:auto;top:calc(var(--bg-bar,48px) + 60px + env(safe-area-inset-top));max-height:34svh}}

.lapw .pg .tr{flex:1;height:4px;border-radius:2px;background:#e9ebef;overflow:hidden}
.lapw .pg .tr i{display:block;height:100%;width:0;background:var(--bg-s-cong,#5B6472);transition:width .3s}
.lapw .pg b{font-variant-numeric:tabular-nums;color:#15171C}
.lapw .x{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:10px;background:none;font-size:22px;line-height:1;color:#626773;cursor:pointer}
.lapw .x:hover{background:#f1f2f5}
.lapw .msg{margin:10px 16px 0;padding:10px 12px;border-radius:10px;font:500 14px/1.5 var(--bg-font,system-ui,sans-serif);background:#f3f4f6;color:#454A55}
.lapw .msg b{display:block;color:#15171C;margin-bottom:2px}
.lapw .msg ul{margin:4px 0 0;padding-left:18px}
.lapw .msg li{margin:2px 0}
.lapw .msg.ok{background:color-mix(in srgb,var(--bg-ok,#1F7A4D) 10%,#fff)}
.lapw .msg.ok b{color:var(--bg-ok,#1F7A4D)}
.lapw .msg.bad{background:color-mix(in srgb,var(--bg-bad,#B3261E) 8%,#fff)}
.lapw .msg.bad b{color:var(--bg-bad,#B3261E)}
.lapw .msg .tl{display:block;margin-top:6px;font-size:13px;color:#626773}
.lapw .ls{flex:1;min-height:0;overflow:auto;padding:10px 12px 4px;display:flex;flex-direction:column;gap:6px}
.lapw .ls button{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border:1px solid rgba(16,24,40,.14);border-radius:10px;background:#fff;color:#15171C;font:600 14px/1.3 var(--bg-font,system-ui,sans-serif);text-align:left;cursor:pointer}
.lapw .ls button:hover{border-color:#626773}
.lapw .ls button .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--bg-mono,monospace);background:#f1f2f5;color:#626773}
.lapw .ls button.in{background:#f6f7f9;border-color:transparent;color:#626773;font-weight:500}
.lapw .ls button.in .n{background:#15171C;color:#fff}
.lapw .ls button.flag{border-color:var(--bg-bad,#B3261E);box-shadow:0 0 0 2px color-mix(in srgb,var(--bg-bad,#B3261E) 18%,transparent)}
.lapw .ls button.hint{border-color:#1E2A44;box-shadow:0 0 0 2px rgba(30,42,68,.18)}
.lapw .ls .sep{font:600 13px var(--bg-font,system-ui,sans-serif);color:#626773;margin:6px 2px 0}
.lapw .ft{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px;border-top:1px solid rgba(16,24,40,.08)}
.lapw .ft button{height:36px;padding:0 14px;border:1px solid rgba(16,24,40,.18);border-radius:999px;background:#fff;color:#15171C;font:600 13.5px var(--bg-font,system-ui,sans-serif);cursor:pointer}
.lapw .ft button.pri{background:#1E2A44;border-color:#1E2A44;color:#fff}
.lapw .ft button:disabled{opacity:.45;cursor:default}
@media (pointer:coarse){.lapw .ls button{min-height:44px}.lapw .ft button{height:44px}.lapw .x{width:44px;height:44px}}
@media (max-width:700px),(orientation:landscape) and (max-height:520px){
  .lapw{left:8px;right:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));max-height:48svh}
  body.bgs-nav-on .lapw{bottom:calc(76px + env(safe-area-inset-bottom));max-height:42svh}
}
@media (orientation:landscape) and (max-height:520px){.lapw{left:auto;right:8px;width:min(46vw,400px);top:calc(var(--bg-bar,48px) + 8px);bottom:auto;max-height:calc(100svh - var(--bg-bar,48px) - 16px)}}
html[data-chieu] .lapw{background:#fff}html[data-chieu] .lapw .ls button{font-size:17px}html[data-chieu] .lapw .msg{font-size:17px}
